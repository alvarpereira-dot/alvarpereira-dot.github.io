<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ExerciseTimer Cast Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    :root {
      --accent: #10B981;
      --bg-base: #0F1115;
      --surface: rgba(26, 29, 36, 0.92);
      --border: rgba(255, 255, 255, 0.14);
      --text-primary: #F8FAFC;
      --text-muted: #94A3B8;
      --card-text-primary: #F8FAFC;
      --card-text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: var(--bg-base); color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.45s ease;
    }
    .tv-root {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      justify-content: space-between; padding: 2.6vh 3.6vw; position: relative;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 2vw; z-index: 2; }
    .brand-row { display: flex; align-items: center; gap: 1.2vw; min-width: 0; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 0.55vw;
      padding: 0.7vh 1.2vw; border-radius: 999px;
      font-size: clamp(13px, 1.35vw, 24px); font-weight: 800; letter-spacing: 0.08em;
      background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34D399; white-space: nowrap;
    }
    .live-pill.paused {
      background: rgba(244, 63, 94, 0.25); border-color: rgba(244, 63, 94, 0.55); color: #FDA4AF;
    }
    .live-dot {
      width: 0.7vw; height: 0.7vw; min-width: 9px; min-height: 9px;
      border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor;
    }
    .routine-title {
      font-size: clamp(20px, 2.2vw, 42px); font-weight: 800; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .state-screen { display: none; flex: 1; width: 100%; min-height: 0; }
    .state-screen.visible { display: flex; }
    .center-card {
      margin: auto; max-width: 72vw; text-align: center; padding: 5vh 4vw;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .center-icon { font-size: clamp(54px, 6.5vw, 120px); margin-bottom: 2vh; }
    .center-title { font-size: clamp(28px, 3.6vw, 68px); font-weight: 900; margin-bottom: 1.5vh; color: var(--card-text-primary); }
    .center-sub { font-size: clamp(18px, 1.9vw, 34px); color: var(--card-text-muted); line-height: 1.45; }

    /* Layout espejo del teléfono en horizontal */
    #screen-active {
      align-items: center;
      justify-content: space-between;
      gap: 3.6vw;
      padding: 1.2vh 1vw;
    }
    .info-column {
      flex: 1.15 1 0%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2.2vh;
    }
    .ring-column {
      flex: 0.95 1 0%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring-wrapper {
      position: relative;
      width: min(82vh, 50vw);
      height: min(82vh, 50vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-circle {
      position: absolute;
      inset: 6.2%;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .media-circle.has-media { display: flex; }
    .media-circle img, .media-circle canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transition: opacity 0.15s ease;
    }
    .media-scrim {
      position: absolute; inset: 0;
      background: radial-gradient(circle, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.28) 55%, rgba(0,0,0,0.52) 100%);
      pointer-events: none;
    }
    .ring-svg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      transform: rotate(-90deg); filter: drop-shadow(0 0 18px rgba(0, 0, 0, 0.45));
      pointer-events: none;
    }
    .ring-track { fill: none; stroke: rgba(255, 255, 255, 0.16); stroke-width: 12; }
    .ring-progress {
      fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round;
      transition: stroke 0.3s ease;
    }
    .ring-center-overlay {
      position: relative; z-index: 3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0 9%; pointer-events: none;
    }
    .ring-center-fallback { display: none; }
    .ring-center-icon {
      font-size: clamp(28px, 3vw, 54px); margin-bottom: 0.6vh; opacity: 0.92;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.55));
    }
    .phase-badge {
      align-self: center; padding: 1.1vh 2.4vw; border-radius: 16px;
      font-size: clamp(18px, 2.1vw, 40px); font-weight: 900; letter-spacing: 0.1em;
      text-transform: uppercase; background: rgba(16, 185, 129, 0.2);
      color: var(--accent); border: 2px solid var(--accent);
    }
    .exercise-name {
      font-size: clamp(32px, 4.1vw, 78px); font-weight: 900; line-height: 1.1;
      color: var(--text-primary); text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      max-width: 100%;
    }
    .giant-clock {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: clamp(96px, 16vw, 310px); font-weight: 900; line-height: 0.96;
      letter-spacing: -0.03em; color: #FFFFFF;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.9), 0 0 16px rgba(0, 0, 0, 0.75);
      white-space: nowrap;
    }
    .giant-clock.has-mins { font-size: clamp(68px, 10.8vw, 206px); }
    .giant-clock.has-hours { font-size: clamp(44px, 6.8vw, 128px); }
    .next-banner {
      font-size: clamp(18px, 2vw, 38px); font-weight: 800; color: #FBBF24;
      min-height: 1.3em; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .metrics-grid {
      width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.2vw; margin-top: 1.2vh;
    }
    .metrics-grid.with-cycle { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .metric-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 1.8vh 1.2vw; text-align: center;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
    }
    .metric-label {
      font-size: clamp(11px, 1.1vw, 20px); font-weight: 800;
      color: var(--card-text-muted); letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 0.5vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .metric-val {
      font-size: clamp(22px, 2.5vw, 48px); font-weight: 900;
      color: var(--card-text-primary); white-space: nowrap;
    }
    .metric-val.cyan { color: #22D3EE; }
    .metric-val.green { color: #10B981; }
    .metric-val.amber { color: #FBBF24; }
  </style>
</head>
<body>
  <div class="tv-root" id="tv-root">
    <div class="topbar">
      <div class="brand-row">
        <div class="live-pill" id="live-pill">
          <span class="live-dot"></span>
          <span id="live-pill-text">LIVE</span>
        </div>
        <div class="routine-title" id="routine-title">ExerciseTimer TV</div>
      </div>
    </div>

    <div class="state-screen visible" id="screen-idle">
      <div class="center-card">
        <div class="center-icon">⏱️</div>
        <div class="center-title" id="idle-title">TV Display Ready</div>
        <div class="center-sub" id="idle-sub">Start a routine on your phone to see the live workout timer here.</div>
      </div>
    </div>

    <div class="state-screen" id="screen-active">
      <div class="info-column">
        <div class="phase-badge" id="phase-badge">PREP</div>
        <div class="exercise-name" id="exercise-name"></div>
        <div class="next-banner" id="next-banner"></div>
        <div class="metrics-grid" id="metrics-grid">
          <div class="metric-card">
            <div class="metric-label" id="lbl-ex">EXERCISE</div>
            <div class="metric-val" id="val-ex">1 / 1</div>
          </div>
          <div class="metric-card">
            <div class="metric-label" id="lbl-round">ROUND</div>
            <div class="metric-val cyan" id="val-round">1 / 1</div>
          </div>
          <div class="metric-card" id="card-cycle" style="display:none;">
            <div class="metric-label" id="lbl-cycle">CYCLE</div>
            <div class="metric-val amber" id="val-cycle">1 / 1</div>
          </div>
          <div class="metric-card">
            <div class="metric-label" id="lbl-rem">REMAINING</div>
            <div class="metric-val green" id="val-rem">00:00</div>
          </div>
        </div>
      </div>

      <div class="ring-column">
        <div class="ring-wrapper">
          <div class="media-circle" id="media-circle">
            <img id="ex-gif" alt="" crossorigin="anonymous" />
            <canvas id="ex-freeze"></canvas>
            <div class="media-scrim"></div>
          </div>
          <div class="ring-center-overlay">
            <div class="ring-center-fallback" id="ring-fallback">
              <div class="ring-center-icon" id="ring-phase-icon">💪</div>
            </div>
            <div class="giant-clock" id="giant-clock">00:00</div>
          </div>
          <svg class="ring-svg" viewBox="0 0 240 240">
            <circle class="ring-track" cx="120" cy="120" r="108"></circle>
            <circle class="ring-progress" id="ring-progress" cx="120" cy="120" r="108"
                    stroke-dasharray="678.584" stroke-dashoffset="0"></circle>
          </svg>
        </div>
      </div>
    </div>

    <div class="state-screen" id="screen-completed">
      <div class="center-card">
        <div class="center-icon">🏆</div>
        <div class="center-title" id="completed-title">WORKOUT COMPLETED!</div>
        <div class="center-sub" id="completed-sub"></div>
      </div>
    </div>

    <div class="state-screen" id="screen-disconnected">
      <div class="center-card">
        <div class="center-icon">📺</div>
        <div class="center-title" id="disc-title">Session Ended</div>
        <div class="center-sub" id="disc-sub">The workout timer disconnected from the phone.</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const CAST_NAMESPACE = 'urn:x-cast:com.example.exercisetimer';
      const CIRCUMFERENCE = 2 * Math.PI * 108;
      let latestSeq = -1;
      let animStatus = 'IDLE';
      let animStartPerf = 0;
      let baseRemainingMs = 0;
      let durationMs = 1000;
      let currentMediaSrc = '';
      let shouldAnimateGif = false;
      let gifLoadedOk = false;
      let audioCtx = null;
      let activeAudioSource = null;
      let activeHtmlAudio = null;
      let lastAudioCueSeq = -1;
      let hasReceivedAudioCue = false;

      const elBody = document.body;
      const elLivePill = document.getElementById('live-pill');
      const elLiveText = document.getElementById('live-pill-text');
      const elRoutineTitle = document.getElementById('routine-title');
      const scIdle = document.getElementById('screen-idle');
      const scActive = document.getElementById('screen-active');
      const scCompleted = document.getElementById('screen-completed');
      const scDisconnected = document.getElementById('screen-disconnected');
      const elMediaCircle = document.getElementById('media-circle');
      const elGif = document.getElementById('ex-gif');
      const elFreeze = document.getElementById('ex-freeze');
      const elFallback = document.getElementById('ring-fallback');
      const elPhaseIcon = document.getElementById('ring-phase-icon');
      const elRingProgress = document.getElementById('ring-progress');
      const elPhaseBadge = document.getElementById('phase-badge');
      const elExName = document.getElementById('exercise-name');
      const elClock = document.getElementById('giant-clock');
      const elNext = document.getElementById('next-banner');
      const elMetricsGrid = document.getElementById('metrics-grid');
      const elCardCycle = document.getElementById('card-cycle');

      function showScreen(target) {
        [scIdle, scActive, scCompleted, scDisconnected].forEach(function(s) {
          if (s === target) s.classList.add('visible'); else s.classList.remove('visible');
        });
      }

      function hexToRgba(hex, alpha) {
        const clean = (hex || '#10B981').replace('#', '').trim();
        if (clean.length !== 6) return 'rgba(16,185,129,' + alpha + ')';
        return 'rgba(' + parseInt(clean.slice(0,2),16) + ',' + parseInt(clean.slice(2,4),16) + ',' + parseInt(clean.slice(4,6),16) + ',' + alpha + ')';
      }

      function isLightHex(hex) {
        const clean = (hex || '#0F1115').replace('#', '').trim();
        if (clean.length !== 6) return false;
        const r = parseInt(clean.slice(0,2), 16) / 255;
        const g = parseInt(clean.slice(2,4), 16) / 255;
        const b = parseInt(clean.slice(4,6), 16) / 255;
        return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.52;
      }

      function mixBackground(baseHex, tintHex, w) {
        const b = (baseHex || '#0F1115').replace('#', '').trim();
        const t = (tintHex || '#10B981').replace('#', '').trim();
        if (b.length !== 6 || t.length !== 6) return baseHex || '#0F1115';
        const r = Math.round(parseInt(b.slice(0,2),16)*(1-w) + parseInt(t.slice(0,2),16)*w);
        const g = Math.round(parseInt(b.slice(2,4),16)*(1-w) + parseInt(t.slice(2,4),16)*w);
        const bl = Math.round(parseInt(b.slice(4,6),16)*(1-w) + parseInt(t.slice(4,6),16)*w);
        return 'rgb(' + r + ',' + g + ',' + bl + ')';
      }

      function formatMillis(ms) {
        const totalSec = Math.max(0, Math.floor(ms / 1000));
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        const mm = mins < 10 ? '0' + mins : '' + mins;
        const ss = secs < 10 ? '0' + secs : '' + secs;
        if (hrs > 0) return (hrs < 10 ? '0' + hrs : '' + hrs) + ':' + mm + ':' + ss;
        if (mins > 0) return mm + ':' + ss;
        return ss;
      }

      function setClockText(txt) {
        elClock.textContent = txt;
        elClock.classList.remove('has-mins', 'has-hours');
        if (txt && txt.length > 5) elClock.classList.add('has-hours');
        else if (txt && txt.length > 2) elClock.classList.add('has-mins');
      }

      function ensureAudioContext() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(function() {});
          }
        } catch (e) {}
        return audioCtx;
      }

      function stopActiveVoice() {
        try {
          if (activeAudioSource) {
            activeAudioSource.stop();
            activeAudioSource.disconnect();
            activeAudioSource = null;
          }
        } catch (e) {}
        try {
          if (activeHtmlAudio) {
            activeHtmlAudio.pause();
            activeHtmlAudio = null;
          }
        } catch (e) {}
      }

      function playHtmlAudioFallback(src) {
        if (!src) return;
        try {
          stopActiveVoice();
          const a = new Audio(src);
          activeHtmlAudio = a;
          a.play().catch(function() {});
        } catch (e) {}
      }

      function playPcm8Base64(b64, sampleRate) {
        if (!b64) return false;
        const ctx = ensureAudioContext();
        if (!ctx || typeof ctx.createBuffer !== 'function') return false;
        try {
          const bin = atob(b64);
          const len = bin.length;
          if (len <= 0) return false;
          const sr = sampleRate || 8000;
          const buffer = ctx.createBuffer(1, len, sr);
          const ch = buffer.getChannelData(0);
          for (let i = 0; i < len; i++) {
            ch[i] = (bin.charCodeAt(i) - 128) / 128.0;
          }
          stopActiveVoice();
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          src.connect(ctx.destination);
          activeAudioSource = src;
          src.start(0);
          return true;
        } catch (e) {
          return false;
        }
      }

      function handleAudioCue(p) {
        if (!p) return;
        if (typeof p.seq === 'number' && p.seq <= lastAudioCueSeq) return;
        if (typeof p.seq === 'number') lastAudioCueSeq = p.seq;
        hasReceivedAudioCue = true;

        if (p.pcm8Base64 && playPcm8Base64(p.pcm8Base64, p.sampleRate)) {
          return;
        }
        if (p.audioBase64) {
          const dataUri = 'data:audio/wav;base64,' + p.audioBase64;
          const ctx = ensureAudioContext();
          if (ctx && typeof ctx.decodeAudioData === 'function') {
            try {
              const bin = atob(p.audioBase64);
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              ctx.decodeAudioData(
                bytes.buffer,
                function(decoded) {
                  stopActiveVoice();
                  const src = ctx.createBufferSource();
                  src.buffer = decoded;
                  src.connect(ctx.destination);
                  activeAudioSource = src;
                  src.start(0);
                },
                function() { playHtmlAudioFallback(dataUri); }
              );
              return;
            } catch (e) {}
          }
          playHtmlAudioFallback(dataUri);
        }
      }

      function drawFirstFrameToCanvas() {
        if (!gifLoadedOk || !elGif.naturalWidth || !elGif.naturalHeight) return;
        const size = 360;
        elFreeze.width = size; elFreeze.height = size;
        const ctx = elFreeze.getContext('2d');
        if (!ctx) return;
        const scale = Math.max(size / elGif.naturalWidth, size / elGif.naturalHeight);
        const dw = elGif.naturalWidth * scale, dh = elGif.naturalHeight * scale;
        ctx.clearRect(0, 0, size, size);
        try { ctx.drawImage(elGif, (size - dw) / 2, (size - dh) / 2, dw, dh); } catch (e) {}
      }

      function syncMediaVisibility() {
        if (!currentMediaSrc || !gifLoadedOk) {
          elMediaCircle.classList.remove('has-media');
          elFallback.style.display = 'block';
          return;
        }
        elMediaCircle.classList.add('has-media');
        elFallback.style.display = 'none';
        elGif.style.opacity = shouldAnimateGif ? '1' : '0';
        elFreeze.style.opacity = shouldAnimateGif ? '0' : '1';
      }

      elGif.onload = function() { gifLoadedOk = true; drawFirstFrameToCanvas(); syncMediaVisibility(); };
      elGif.onerror = function() { gifLoadedOk = false; syncMediaVisibility(); };

      function updateMediaSource(src, animate) {
        shouldAnimateGif = !!animate;
        const nextSrc = src || '';
        if (nextSrc !== currentMediaSrc) {
          currentMediaSrc = nextSrc;
          gifLoadedOk = false;
          if (nextSrc) { elGif.src = nextSrc; }
          else { elGif.removeAttribute('src'); syncMediaVisibility(); }
        } else {
          syncMediaVisibility();
        }
      }

      function playTone(freq, dur, type) {
        if (hasReceivedAudioCue) return;
        try {
          const ctx = ensureAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + dur);
        } catch (e) {}
      }

      function handleSoundEvent(ev) {
        if (!ev || hasReceivedAudioCue) return;
        if (ev === 'COUNTDOWN') playTone(880, 0.12, 'sine');
        else if (ev === 'WORK') playTone(1046.5, 0.32, 'triangle');
        else if (ev === 'REST' || ev === 'PREPARE') playTone(587.3, 0.28, 'sine');
        else if (ev === 'COMPLETED') { playTone(784, 0.18, 'triangle'); setTimeout(function() { playTone(1046.5, 0.35, 'triangle'); }, 180); }
      }

      function setRingProgress(progress) {
        const clamped = Math.max(0, Math.min(1, progress));
        elRingProgress.style.strokeDashoffset = (CIRCUMFERENCE * (1 - clamped)).toFixed(2);
      }

      function applyPayload(p) {
        if (!p) return;
        if (p.type === 'AUDIO_CUE') {
          handleAudioCue(p);
          return;
        }
        if (typeof p.seq === 'number' && p.seq < latestSeq && p.type !== 'SESSION_ENDED') return;
        if (typeof p.seq === 'number') latestSeq = p.seq;

        if (p.type === 'SESSION_ENDED') {
          animStatus = 'DISCONNECTED';
          stopActiveVoice();
          document.getElementById('disc-title').textContent = p.disconnectedTitle || 'Session Ended';
          document.getElementById('disc-sub').textContent = p.disconnectedSubtitle || '';
          elLivePill.classList.add('paused');
          elLiveText.textContent = 'OFF';
          elBody.style.backgroundColor = '#0F1115';
          showScreen(scDisconnected);
          return;
        }

        const accent = p.accentColorHex || '#10B981';
        const baseBg = p.backgroundColorHex || '#0F1115';
        const cardBg = p.cardColorHex || '#1A1D24';
        const lightCard = isLightHex(cardBg);
        document.documentElement.style.setProperty('--accent', accent);
        document.documentElement.style.setProperty('--bg-base', baseBg);
        document.documentElement.style.setProperty('--surface', hexToRgba(cardBg, 0.92));
        document.documentElement.style.setProperty('--card-text-primary', lightCard ? '#0F172A' : '#F8FAFC');
        document.documentElement.style.setProperty('--card-text-muted', lightCard ? '#475569' : '#94A3B8');
        document.documentElement.style.setProperty('--border', lightCard ? 'rgba(15,23,42,0.14)' : 'rgba(255,255,255,0.14)');

        elRoutineTitle.textContent = p.routineName || p.appTitle || 'ExerciseTimer TV';
        handleSoundEvent(p.soundEvent);
        animStatus = p.status || 'IDLE';

        if (animStatus === 'PAUSED') {
          elLivePill.classList.add('paused');
          elLiveText.textContent = p.pausedBadgeLabel || 'PAUSED';
        } else {
          elLivePill.classList.remove('paused');
          elLiveText.textContent = p.liveBadgeLabel || 'LIVE';
        }

        if (animStatus === 'IDLE') {
          document.getElementById('idle-title').textContent = p.idleTitle || '';
          document.getElementById('idle-sub').textContent = p.idleSubtitle || '';
          elBody.style.backgroundColor = baseBg;
          const lightMain = isLightHex(baseBg);
          document.documentElement.style.setProperty('--text-primary', lightMain ? '#0F172A' : '#F8FAFC');
          document.documentElement.style.setProperty('--text-muted', lightMain ? '#475569' : '#94A3B8');
          updateMediaSource('', false);
          showScreen(scIdle);
          return;
        }

        if (animStatus === 'COMPLETED') {
          document.getElementById('completed-title').textContent = p.completedTitle || '';
          document.getElementById('completed-sub').textContent = p.completedSubtitle || '';
          elBody.style.backgroundColor = mixBackground(baseBg, accent, p.fullScreenFill ? 0.36 : 0.12);
          updateMediaSource('', false);
          showScreen(scCompleted);
          return;
        }

        showScreen(scActive);
        if (animStatus === 'PAUSED') {
          elBody.style.backgroundColor = '#7A0D1E';
          document.documentElement.style.setProperty('--text-primary', '#F8FAFC');
          document.documentElement.style.setProperty('--text-muted', '#CBD5E1');
        } else {
          elBody.style.backgroundColor = p.fullScreenFill
            ? mixBackground(baseBg, accent, 0.40)
            : mixBackground(baseBg, accent, 0.15);
          const lightMain = !p.fullScreenFill && isLightHex(baseBg);
          document.documentElement.style.setProperty('--text-primary', lightMain ? '#0F172A' : '#F8FAFC');
          document.documentElement.style.setProperty('--text-muted', lightMain ? '#475569' : '#94A3B8');
        }

        elPhaseBadge.textContent = p.phaseLabel || '';
        elPhaseBadge.style.color = accent;
        elPhaseBadge.style.borderColor = accent;
        elPhaseBadge.style.backgroundColor = hexToRgba(accent, 0.2);

        elExName.textContent = p.exerciseName || p.routineName || '';
        elExName.style.display = (p.exerciseName && p.exerciseName.trim().length > 0) ? '-webkit-box' : 'none';
        elNext.textContent = p.nextExerciseText || '';

        document.getElementById('lbl-ex').textContent = p.metricExerciseLabel || 'EXERCISE';
        document.getElementById('val-ex').textContent = p.exerciseCounter || '1 / 1';
        document.getElementById('lbl-round').textContent = p.metricRoundLabel || 'ROUND';
        document.getElementById('val-round').textContent = p.roundCounter || '1 / 1';
        document.getElementById('lbl-rem').textContent = p.metricRemainingLabel || 'REMAINING';
        document.getElementById('val-rem').textContent = p.totalRemainingText || '00:00';

        if (p.cycleCounter && p.cycleCounter.length > 0) {
          elCardCycle.style.display = 'block';
          elMetricsGrid.classList.add('with-cycle');
          document.getElementById('lbl-cycle').textContent = p.metricCycleLabel || 'CYCLE';
          document.getElementById('val-cycle').textContent = p.cycleCounter;
        } else {
          elCardCycle.style.display = 'none';
          elMetricsGrid.classList.remove('with-cycle');
        }

        elPhaseIcon.textContent = p.phase === 'WORK' ? '🔥' : (p.phase === 'PREPARE' ? '⚡' : '😮‍💨');
        updateMediaSource(p.mediaUrlCast || p.mediaUrlWifi, p.animateMedia);

        baseRemainingMs = Math.max(0, p.remainingMillis || 0);
        durationMs = Math.max(1, p.durationMillis || 1000);
        animStartPerf = performance.now();
        setClockText(p.formattedRemaining || formatMillis(baseRemainingMs));
        setRingProgress(baseRemainingMs / durationMs);
      }

      function animationTick(now) {
        if (animStatus === 'RUNNING') {
          const currentLeft = Math.max(0, baseRemainingMs - Math.max(0, now - animStartPerf));
          setRingProgress(currentLeft / durationMs);
          setClockText(formatMillis(currentLeft));
        }
        requestAnimationFrame(animationTick);
      }

      try {
        const context = cast.framework.CastReceiverContext.getInstance();
        context.addCustomMessageListener(CAST_NAMESPACE, function(customEvent) {
          try {
            const data = typeof customEvent.data === 'string' ? JSON.parse(customEvent.data) : customEvent.data;
            applyPayload(data);
            if (data && data.type === 'SESSION_ENDED') {
              setTimeout(function() { try { context.stop(); } catch (e) {} }, 700);
            }
          } catch (err) {}
        });
        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        options.customNamespaces = {};
        options.customNamespaces[CAST_NAMESPACE] = cast.framework.system.MessageType.JSON;
        context.start(options);
      } catch (e) {}

      requestAnimationFrame(animationTick);
    })();
  </script>
</body>
</html>
